<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Nlw Hotspot">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>ReffaBisaTuh</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link href="static/plugin/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/plugin/font-awesome/css/fontawesome-all.min.css" rel="stylesheet">
    <link href="static/plugin/et-line/style.css" rel="stylesheet">
    <link href="static/plugin/themify-icons/themify-icons.css" rel="stylesheet">
    <link href="static/plugin/owl-carousel/css/owl.carousel.min.css" rel="stylesheet">
    <link href="static/plugin/magnific/magnific-popup.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
    <link href="static/css/color/default.css" rel="stylesheet" id="color_theme">
  </head>

  <body data-spy="scroll" data-target="#navbar" data-offset="98">
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post">
      <input type="hidden" name="username">
      <input type="hidden" name="password">
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">
    </form>
    $(endif)

    <div id="loading">
      <div class="load-circle"><span class="one"></span></div>
    </div>
    <header>
      <nav class="navbar header-nav navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img class="light-logo" src="static/img/NLW_LOGO.svg" alt="NLW">
            <img class="dark-logo" src="static/img/NLW_LOGO.svg" alt="NLW">
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
              <span></span>
              <span></span>
              <span></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbar">
            <ul class="navbar-nav ml-auto align-items-center">
              <li><a class="nav-link" href="#home">Home</a></li>
              <li><a class="nav-link" href="https://i.pinimg.com/736x/0e/96/24/0e96246b7f2178bcf942715aef171a9f.jpg" target="_blank" rel="noopener">Whatsapp</a></li>
              <li><a class="nav-link" href="https://i.pinimg.com/736x/1a/01/16/1a01165e8a67a7959ee1d0a06da7a0ca.jpg" target="_blank" rel="noopener">About Me</a></li>
              <li><a class="nav-link" href="https://i.pinimg.com/originals/c0/cb/23/c0cb231c68fca02464f4ab45b1b0acd0.gif" target="_blank" rel="noopener">Instagram</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section id="home" class="home-banner-03 theme-bg bg-effect-box">
        <style>
          #home .container { position: relative; z-index: 1; }
          .hs-fx { position: absolute; inset: 0; pointer-events: none; }
          .hs-fx::before {
            content: ""; position: absolute; inset: -60px;
            background-image:
              radial-gradient(rgba(255,255,255,.13) 1.2px, transparent 1.7px),
              radial-gradient(rgba(255,255,255,.06) 1.2px, transparent 1.7px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
            animation: hs-drift 70s linear infinite;
          }
          @keyframes hs-drift { to { transform: translate3d(-36px,-36px,0); } }
        </style>
        <div class="hs-fx" aria-hidden="true"></div>
        <div id="particles_effect" class="particles-effect"></div>
        <div class="container">
          <div class="row align-items-center justify-content-center p-100px-tb sm-p-60px-b">
            <div class="col-lg-5 md-p-30px-tb">
              <h5 class="white-color">ReffaAjadeh</h5>
              <div style="display:flex; align-items:center; gap:12px;">
                <h1 class="font-alt white-color" style="margin:0;">Skahada</h1>
                <span style="position:relative; display:inline-block; line-height:0;">
                  <img src="static/img/ayam.gif" alt="" style="height:52px; display:block;">
                  <i style="position:absolute; left:50%; bottom:-1px; width:62%; height:9px; transform:translateX(-50%); background:radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 68%);"></i>
                </span>
              </div>
              <p class="white-color-light">Login Hotspot</p>
              <div class="subscribe-block">
                  <div class="card-block py-lg px-md">
                    <form name="login" id="loginForm" class="md-form form-light" action="$(link-login-only)" method="post" autocomplete="on">
                      <input type="hidden" name="dst" value="$(link-orig)">
                      <input type="hidden" name="popup" value="true">
                      <div class="row">
                        <div class="col-md-6">
                          <div class="form-group">
                            <label for="inputUser" class="form-label">Username</label>
                            <div class="md-form-line-wrap">
                              <input id="inputUser" type="text" name="username" placeholder="Username" class="form-control" autofocus required autocomplete="username">
                            </div>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-group">
                            <label for="inputPassword" class="form-label">Password</label>
                            <div class="md-form-line-wrap">
                              <input id="inputPassword" type="password" name="password" placeholder="Password" class="form-control" required autocomplete="current-password">
                            </div>
                          </div>
                        </div>
                        $(if error)
                        <div class="col-md-12">
                          <div class="form-group">
                            <p style="color:#ffffffe8; margin:0">Terjadi kesalahan: $(error)</p>
                          </div>
                        </div>
                        $(endif)
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-block btn-light"><span class="btn-elem-wrap"><span class="text" style="color: rgb(7, 76, 252)">LOGIN</span></span></button>
                        </div>
                      </div>
                    </form>
                  </div>
                <label>Powered by Nlw</label>
              </div>
            </div>
            <div class="col-lg-7 text-center p-50px-l">
              <img src="static/img/nawawuy.webp" alt="">
            </div>
          </div>
        </div>
      </section>

      </main>
    <footer class="footer footer-dark">
      <div class="footer-copy">
        <div class="row">
          <div class="col-12">
            <p>NlwEnterprise - All Rights Reserved.</p>
          </div>
        </div>
      </div>
    </footer>

    <script src="static/js/jquery-3.2.1.min.js"></script>
    <script src="static/js/jquery-migrate-3.0.0.min.js"></script>
    <script src="static/plugin/appear/jquery.appear.js"></script>
    <script src="static/plugin/bootstrap/js/popper.min.js"></script>
    <script src="static/plugin/bootstrap/js/bootstrap.js"></script>
    <script src="static/plugin/particles/particles.min.js"></script>
    <script src="static/plugin/particles/particles-app.js"></script>
    <script src="static/js/jquery.parallax-scroll.js"></script>
    <script src="static/js/custom.js"></script>

    $(if chap-id)
    <script src="md5.js"></script>
    <script>
      (function () {
        var form = document.forms.login;
        if (!form) return;
        form.addEventListener('submit', function (e) {
          var u = form.elements.username, p = form.elements.password;
          if (!u || !p || !u.value || !p.value) return;
          e.preventDefault();
          var sendin = document.forms.sendin;
          sendin.elements.username.value = u.value;
          sendin.elements.password.value = hexMD5('$(chap-id)' + p.value + '$(chap-challenge)');
          sendin.submit();
        });
      })();
    </script>
    $(endif)
    <script>
      (function () {
        var el = document.getElementById('inputUser');
        if (el) el.focus();
        var t = document.getElementById('menu-toggle');
        var w = document.getElementById('wrapper');
        if (t && w) t.addEventListener('click', function (e) { e.preventDefault(); w.classList.toggle('toggled'); });
      })();
    </script>

  </body>
</html>
